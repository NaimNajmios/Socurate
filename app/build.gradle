plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.0'
}

android {
    namespace 'com.najmi.oreamnos'
    compileSdk 34

    defaultConfig {
        applicationId "com.najmi.oreamnos"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86_64"
            universalApk false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        compose true
    }
}

dependencies {
    // Kotlin Standard Library
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"

    // AndroidX Core
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.12.0'
    
    // Lifecycle & ViewModel (MVVM)
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    
    // Security for encrypted preferences
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    
    // Networking
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    
    // JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // HTML parsing
    implementation 'org.jsoup:jsoup:1.17.2'
    
    // Shimmer effect for skeleton loading
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    
    // Markdown rendering for AI output
    implementation 'io.noties.markwon:core:4.6.2'
    
    // Compose Bill of Materials (BOM) - keeps versions compatible
    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom
    androidTestImplementation composeBom

    // Material Design 3 for Compose
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    
    // Core Compose libraries
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Activity integration
    implementation 'androidx.activity:activity-compose:1.8.2'
    
    // ViewModel integration
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'

    // Navigation Compose — for CardGeneratorScreen destination
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // Coil Compose — for loading gallery images into card backgrounds
    implementation 'io.coil-kt:coil-compose:2.6.0'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // ML Kit Text Recognition
    implementation 'com.google.mlkit:text-recognition:16.0.0'

    // Coroutines Play Services (for await() on Tasks)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // Palette for color extraction
    implementation 'androidx.palette:palette-ktx:1.0.0'

    // LiteRT-LM for on-device GenAI (vision + text)
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.9.0-alpha06'
    
    // GPU acceleration
    implementation 'com.google.ai.edge.litert:litert-gpu:latest.release'
    
    // For coroutines with LiteRT
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
}
